<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: #fffaf7;
      }

      img {
        display: block;
        /* Keep the complete logo inside a centered 630px square crop. */
        width: 560px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <img src="../assets/img/Mobile-Menu-Logo.svg" alt="長穩社福慈善基金會" />
  </body>
</html>
